<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Outer Glow -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#b8860b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Base 3D Tile Gradient -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a30" />
      <stop offset="45%" stop-color="#17171b" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </linearGradient>

    <!-- Metallic Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd875" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#c59b27" />
      <stop offset="75%" stop-color="#554411" />
      <stop offset="100%" stop-color="#ffd875" />
    </linearGradient>

    <!-- Inner Bevel Shadow -->
    <linearGradient id="innerShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7" />
    </linearGradient>

    <!-- 3D Ribbon 'S' Upper Segment -->
    <linearGradient id="ribbonTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1c5" />
      <stop offset="35%" stop-color="#eac468" />
      <stop offset="70%" stop-color="#c8972b" />
      <stop offset="100%" stop-color="#936814" />
    </linearGradient>

    <!-- 3D Ribbon 'S' Middle Fold -->
    <linearGradient id="ribbonMid" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#ffd978" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- 3D Ribbon 'S' Lower Segment -->
    <linearGradient id="ribbonBottom" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1c5" />
      <stop offset="30%" stop-color="#eac468" />
      <stop offset="75%" stop-color="#b68218" />
      <stop offset="100%" stop-color="#694807" />
    </linearGradient>

    <!-- Specular Arc Gradient -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="tileShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#d4af37" flood-opacity="0.25" />
    </filter>

    <filter id="emblemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ffd700" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ambient Golden Aura -->
  <circle cx="256" cy="256" r="240" fill="url(#auraGlow)" />

  <!-- 3D Rounded Squircle Tile Base -->
  <rect x="52" y="52" width="408" height="408" rx="100" ry="100" fill="url(#tileGrad)" stroke="url(#rimGrad)" stroke-width="7" filter="url(#tileShadow)" />

  <!-- Inner Bevel Overlay -->
  <rect x="56" y="56" width="400" height="400" rx="96" ry="96" fill="url(#innerShadow)" />

  <!-- Specular Glass Curve Highlight -->
  <path d="M 60,152 C 60,98 98,60 152,60 L 360,60 C 230,120 120,230 60,360 Z" fill="url(#glassReflection)" />

  <!-- 3D Geometric Sculpted 'S' Monogram -->
  <g filter="url(#emblemGlow)">
    <!-- Upper Loop of 'S' -->
    <path d="M 330,148 C 362,175 362,216 332,242 C 302,268 250,274 212,284 C 180,292 152,306 142,324 L 202,302 C 248,286 312,280 348,248 C 392,210 388,154 340,122 C 304,98 244,96 186,118 L 194,158 C 242,140 292,142 330,148 Z" fill="url(#ribbonTop)" />

    <!-- Central 3D Facet Dynamic Connector -->
    <polygon points="194,158 330,148 316,218 180,228" fill="url(#ribbonMid)" opacity="0.95" />

    <!-- Isometric Fold Chamfer -->
    <path d="M 172,216 L 340,166 C 352,192 344,222 316,242 L 180,286 C 160,266 156,236 172,216 Z" fill="url(#ribbonTop)" opacity="0.85" />

    <!-- Lower Loop of 'S' -->
    <path d="M 182,364 C 150,337 150,296 180,270 C 210,244 262,238 300,228 C 332,220 360,206 370,188 L 310,210 C 264,226 200,232 164,264 C 120,302 124,358 172,390 C 208,414 268,416 326,394 L 318,354 C 270,372 220,370 182,364 Z" fill="url(#ribbonBottom)" />
  </g>

  <!-- 3D Precision Diamond Facet Beads (Jewelry-grade Accents) -->
  <!-- Top Sparkle Bead -->
  <polygon points="352,118 362,130 352,142 342,130" fill="#ffffff" filter="drop-shadow(0 0 6px #ffd700)" />
  <!-- Center Accent Gem -->
  <polygon points="256,244 266,256 256,268 246,256" fill="#fff5d0" filter="drop-shadow(0 0 8px #ffb700)" />
  <!-- Bottom Corner Reflection Bead -->
  <polygon points="160,370 170,382 160,394 150,382" fill="#ffffff" filter="drop-shadow(0 0 6px #ffd700)" />

  <!-- Sparkling Cross-Star Highlight (Top Right) -->
  <g transform="translate(378, 102)">
    <path d="M 0,-18 L 3,-4 L 18,0 L 3,4 L 0,18 L -3,4 L -18,0 L -3,-4 Z" fill="#ffffff" filter="drop-shadow(0 0 8px #ffffff)" />
    <circle cx="0" cy="0" r="3" fill="#ffd700" />
  </g>
</svg>
